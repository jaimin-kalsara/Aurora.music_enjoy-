services:
  - type: web
    name: aurora-music
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # YouTube bot-checks datacenter IPs. Set at least one of these in the Render dashboard.
      - key: YT_COOKIE
        sync: false
      - key: YT_PROXY
        sync: false